[odp]
# Either set api_key directly, or point api_keyfile to a file containing the key.
# CLI flags override these values.

api_key =
api_keyfile = /data/models/share/odp_api.key

base_url = https://api.uspto.gov

# Default behavior when -d/--drawings is NOT provided.
# true/false/yes/no/1/0 are acceptable.

drawings = false
